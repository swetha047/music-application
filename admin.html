<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeStream - Admin</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="top-bar">
    <div class="logo">Vibe<span>Stream</span> Admin</div>
    <a href="index.html" class="admin-link">Back to Player</a>
  </header>

  <main class="admin-container">
    
    <div class="admin-header">
      <h2 class="section-title">Add New Song</h2>
    </div>

    <form id="addSongForm">
      <input type="hidden" id="songId">
      <div class="form-group">
        <label for="title">Song Title *</label>
        <input type="text" id="title" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="artist">Artist *</label>
        <input type="text" id="artist" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="album">Album</label>
        <input type="text" id="album" class="form-control">
      </div>
      <div class="form-group">
        <label for="cover_url">Cover Image URL</label>
        <input type="url" id="cover_url" class="form-control" placeholder="https://...">
      </div>
      <div class="form-group">
        <label for="audio_url">Cloudinary Audio URL *</label>
        <input type="url" id="audio_url" class="form-control" required placeholder="https://res.cloudinary.com/...">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Add Song</button>
      <button type="button" class="btn" id="cancelEditBtn" style="display: none; background: #333; color: white;">Cancel Edit</button>
    </form>

    <div class="admin-songs-list">
      <h2 class="section-title">Manage Songs</h2>
      <div id="adminSongsContainer">
        <!-- Songs list will be injected here -->
      </div>
    </div>

  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
