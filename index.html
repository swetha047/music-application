<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeStream - Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="top-bar">
    <div class="logo">Vibe<span>Stream</span></div>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search for songs, artists, or albums...">
    </div>
    <a href="admin.html" class="admin-link">Admin</a>
  </header>

  <main class="main-content">
    <h2 class="section-title">All Songs</h2>
    <div id="songsGrid" class="song-grid">
      <!-- Songs will be injected here via JavaScript -->
    </div>
  </main>

  <div class="player-bar">
    <div class="now-playing">
      <img id="playerCover" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%2256%22%20height%3D%2256%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%2256%22%20height%3D%2256%22%20fill%3D%22%23282828%22%2F%3E%3C%2Fsvg%3E" alt="Cover">
      <div class="now-playing-info">
        <div id="playerTitle" class="now-playing-title">Select a song</div>
        <div id="playerArtist" class="now-playing-artist"></div>
      </div>
    </div>

    <div class="player-controls-container">
      <div class="player-buttons">
        <button id="prevBtn" class="control-btn" aria-label="Previous">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-1.4 0V1.7a.7.7 0 0 1 .7-.7z"/></svg>
        </button>
        <button id="playPauseBtn" class="control-btn play-pause-btn" aria-label="Play/Pause">
          <svg id="playIcon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"/></svg>
          <svg id="pauseIcon" style="display: none;" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>
        </button>
        <button id="nextBtn" class="control-btn" aria-label="Next">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 1.4 0V1.7a.7.7 0 0 0-.7-.7z"/></svg>
        </button>
      </div>
      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <div id="progressBarWrapper" class="progress-bar-wrapper">
          <div id="progressBar" class="progress-bar"></div>
          <div id="progressThumb" class="progress-thumb"></div>
        </div>
        <span id="durationTime">0:00</span>
      </div>
    </div>

    <div class="volume-control">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="color: var(--text-secondary);"><path d="M9.741.85a.75.75 0 0 1 .375.65v13a.75.75 0 0 1-1.125.65l-6.925-4a3.642 3.642 0 0 1-1.33-4.967 3.639 3.639 0 0 1 1.33-1.332l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.139 2.139 0 0 0 0 3.7l5.8 3.35V2.8l-5.8 3.35zm8.683 4.29V5.56a2.75 2.75 0 0 1 0 4.88z"/></svg>
      <div id="volumeSliderWrapper" class="volume-slider-wrapper">
        <div id="volumeBar" class="volume-bar"></div>
        <div id="volumeThumb" class="volume-thumb"></div>
      </div>
    </div>
  </div>

  <audio id="audioElement" preload="metadata"></audio>
  
  <script type="module" src="app.js"></script>
</body>
</html>
